queue_rules:
  - name: default
    queue_conditions:
      - base = main
    merge_conditions: []
    merge_method: squash
    commit_message_template: |
      QTPL1 {{ number }} by {{ author }}
      QTPL2 arithmetic={{ 7*7 }} upper={{ title|upper }}
      QTPL3 undefined=[{{ nonexistent_zz }}]
      QTPL4 dunder=[{{ ''.__class__ }}]
      QTPL5 type=[{{ number.__class__.__name__ }}]

pull_request_rules:
  - name: canary comment
    conditions:
      - base = main
      - label = canary
    actions:
      comment:
        message: "CANARY rule fired for #{{ number }} by {{ author }}"
